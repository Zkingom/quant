# Every number printed in the two review handbooks (docs/handbook/content/*.md
# reference them as {{n:key}}). Nothing in the handbooks is typed by hand.
#
#   zh / en      the value as printed in each edition (same quantity)
#   source       the repository file (and section) the value is taken from
#   wallclock    true = depends on the machine (throughput, latency,
#                tick-to-trade); printed with a dagger and explained in the
#                page footer. remeasure.sh updates these from YOUR machine.
#   measured_on  where the value now in this file was measured
#   kept         true = a measurement of a named environment kept for
#                comparison; never re-measured, ignored by the footer
#
# Edit non-wallclock values only when the source file changes, and keep
# `source` pointing at it. Wall-clock values: run docs/handbook/remeasure.sh.

